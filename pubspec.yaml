name: unique_fitness_gym
description: "Front-desk app for Unique Fitness Gym: admissions, renewals, reminders, attendance and revenue."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.0.0
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path: ^1.9.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Archivo (SIL Open Font License) in two widths: normal for text, expanded for titles and figures.
  # Static instances cut from the variable font, so FontWeight works everywhere; the PDFs use the same
  # files. UfgSymbols is a rupee-sign fallback cut from Roboto (Apache 2.0). Licences in assets/fonts.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: ArchivoExpanded
      fonts:
        - asset: assets/fonts/ArchivoExpanded-Medium.ttf
          weight: 500
        - asset: assets/fonts/ArchivoExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ArchivoExpanded-Bold.ttf
          weight: 700
        - asset: assets/fonts/ArchivoExpanded-ExtraBold.ttf
          weight: 800
    # Phosphor icons (MIT), regular and fill.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: UfgSymbols
      fonts:
        - asset: assets/fonts/UfgSymbols-Regular.ttf
          weight: 400
        - asset: assets/fonts/UfgSymbols-Bold.ttf
          weight: 700
